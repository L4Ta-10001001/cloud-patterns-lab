services:
  api_a:
    build:
      context: ../04-serverless-docker
    restart: unless-stopped
    networks: [lab]

  api_b:
    build:
      context: ../04-serverless-docker
    restart: unless-stopped
    networks: [lab]

  proxy:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api_a
      - api_b
    networks: [lab]

networks:
  lab: {}

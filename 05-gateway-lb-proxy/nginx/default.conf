server {
    listen 80;
    server_name _;

    location = / {
        default_type text/plain;
        return 200 "NGINX Reverse Proxy activo: usa /a/health o /b/health\n";
    }
    location /a/ {
        proxy_pass http://api_a:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Backend "api-a" always;
    }
    location /b/ {
        proxy_pass http://api_b:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Backend "api-b" always;
    }
}

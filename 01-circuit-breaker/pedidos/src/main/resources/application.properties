spring.application.name=pedidos
server.port=8081
restaurantes.base-url=http://localhost:8080

management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

resilience4j.circuitbreaker.instances.restaurantes.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.restaurantes.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.restaurantes.slidingWindowSize=4
resilience4j.circuitbreaker.instances.restaurantes.minimumNumberOfCalls=4
resilience4j.circuitbreaker.instances.restaurantes.failureRateThreshold=50
resilience4j.circuitbreaker.instances.restaurantes.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.restaurantes.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.restaurantes.automaticTransitionFromOpenToHalfOpenEnabled=true
